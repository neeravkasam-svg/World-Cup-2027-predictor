<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172033"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="CWC 2027 Predictor">
<link rel="manifest" href="manifest.json"><title>CWC 2027 Predictor</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#eef2f7;color:#172033}
header{background:#172033;color:#fff;padding:20px 14px;text-align:center}header h1{margin:0 0 5px;font-size:24px}header p{margin:0;font-size:13px}
main{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 2px 12px #0001}
h2{margin:0 0 12px;font-size:21px}.note,.meta{font-size:13px;color:#667085}.groupTitle{font-size:18px;font-weight:800;margin:4px 0 10px}
.match{border:1px solid #dbe1ea;border-radius:12px;padding:11px;margin:9px 0;background:#fbfcfe}.teams{font-weight:700;font-size:15px;margin:5px 0 7px}
button{border:1px solid #cbd3df;background:#fff;border-radius:9px;padding:9px 8px;margin:3px 2px;font-size:13px}button.selected{background:#172033;color:#fff;border-color:#172033}
button.reset{background:#fff3f3;border-color:#e4a4a4;color:#9d2020}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 4px;border-bottom:1px solid #edf0f4;text-align:center}th:nth-child(2),td:nth-child(2){text-align:left}
.champ{font-size:25px;text-align:center;padding:18px;background:#fff;border-radius:16px;margin:12px 0}.badge{display:inline-block;padding:4px 7px;border-radius:7px;background:#e8edf5;font-size:11px}
@media(max-width:500px){button{width:31%;min-height:42px}.teams{font-size:14px}}
</style></head><body>
<header><h1>🏏 CWC 2027 Predictor</h1><p>Group Stage → Super 7 → Semi-finals → Final</p></header><main id="app"></main>
<script>
const A=["India","Australia","Pakistan","Afghanistan","Zimbabwe","West Indies"],B=["New Zealand","South Africa","Sri Lanka","England","Bangladesh","USA"];
const F={"India":"🇮🇳","Australia":"🇦🇺","Pakistan":"🇵🇰","Afghanistan":"🇦🇫","Zimbabwe":"🇿🇼","West Indies":"🏝️","New Zealand":"🇳🇿","South Africa":"🇿🇦","Sri Lanka":"🇱🇰","England":"🏴","Bangladesh":"🇧🇩","USA":"🇺🇸"};
const G=[
["7 Oct","India","Australia","Cape Town"],["8 Oct","Pakistan","Afghanistan","Tshwane"],["8 Oct","England","Bangladesh","Windhoek"],["9 Oct","Zimbabwe","West Indies","Bulawayo"],["9 Oct","South Africa","New Zealand","Cape Town"],["10 Oct","India","Pakistan","Johannesburg"],["10 Oct","Sri Lanka","USA","Windhoek"],["11 Oct","Zimbabwe","Afghanistan","Bulawayo"],["12 Oct","Australia","West Indies","Paarl"],["12 Oct","New Zealand","Bangladesh","KuGompo City"],["13 Oct","England","Sri Lanka","Windhoek"],["13 Oct","South Africa","USA","Paarl"],["14 Oct","India","Afghanistan","Tshwane"],["15 Oct","Pakistan","West Indies","Bloemfontein"],["15 Oct","Zimbabwe","Australia","Harare"],["16 Oct","Sri Lanka","Bangladesh","Durban"],["16 Oct","South Africa","England","Gqeberha"],["17 Oct","India","West Indies","Bloemfontein"],["17 Oct","New Zealand","USA","Harare"],["18 Oct","Australia","Afghanistan","KuGompo City"],["19 Oct","Zimbabwe","Pakistan","Harare"],["19 Oct","South Africa","Bangladesh","Durban"],["20 Oct","New Zealand","Sri Lanka","Johannesburg"],["20 Oct","England","USA","Harare"],["21 Oct","Afghanistan","West Indies","KuGompo City"],["22 Oct","Australia","Pakistan","Paarl"],["22 Oct","South Africa","Sri Lanka","Johannesburg"],["23 Oct","England","New Zealand","Gqeberha"],["23 Oct","Bangladesh","USA","Tshwane"],["24 Oct","Zimbabwe","India","Victoria Falls"]];
const S=[
["25 Oct","A2","B3","Johannesburg"],["26 Oct","B1","A3","Gqeberha"],["27 Oct","B2","AB4","Tshwane"],["28 Oct","A1","A2","Victoria Falls"],["29 Oct","B1","B3","KuGompo City"],["30 Oct","A3","AB4","Victoria Falls"],["31 Oct","B2","A1","Johannesburg"],["1 Nov","A2","B1","Victoria Falls"],["2 Nov","B3","AB4","Cape Town"],["3 Nov","B2","A3","Durban"],["4 Nov","A1","B1","Paarl"],["5 Nov","A2","AB4","Durban"],["6 Nov","B2","B3","Bloemfontein"],["7 Nov","A1","A3","Cape Town"],["8 Nov","B1","AB4","Durban"],["9 Nov","B2","A2","Gqeberha"],["10 Nov","A3","B3","Bloemfontein"],["11 Nov","A1","AB4","Gqeberha"],["12 Nov","B2","B1","Cape Town"],["13 Nov","A2","A3","Bloemfontein"],["14 Nov","A1","B3","Durban"]];
let p={};const fixed={A1:"India",A2:"Australia",A3:"Pakistan",B1:"New Zealand",B2:"South Africa",B3:"Sri Lanka",AB4:"England"};
function pick(k,v){p[k]=v;localStorage.cwc2027=JSON.stringify(p);render()}function reset(){p={};localStorage.removeItem("cwc2027");render();scrollTo(0,0)}
try{p=JSON.parse(localStorage.cwc2027||"{}")}catch(e){}
function stats(ts,pre){return ts.map(t=>{let pts=0,w=0,l=0,n=0;Object.keys(p).forEach(k=>{if(!k.startsWith(pre))return;let i=+k.slice(1),m=pre=="G"?G[i]:null;if(!m||!m.includes(t))return;let z=p[k];if(z=="NR"){pts++;n++}else if(z==t){pts+=2;w++}else l++});return{t,pts,w,l,n}}).sort((a,b)=>b.pts-a.pts||b.w-a.w||a.t.localeCompare(b.t))}
function table(ts,title,pre="G"){let r=stats(ts,pre);return `<div class="card"><h2>${title}</h2><table><tr><th>#</th><th>Team</th><th>Pts</th><th>W</th><th>L</th><th>T/NR</th></tr>${r.map((x,i)=>`<tr><td>${i+1}</td><td>${F[x.t]} ${x.t}</td><td>${x.pts}</td><td>${x.w}</td><td>${x.l}</td><td>${x.n}</td></tr>`).join("")}</table></div>`}
function match(m,k){let[d,x,y,v]=m,z=p[k];return `<div class="match"><div class="meta">${d} · ${v}</div><div class="teams">${F[x]} ${x} vs ${F[y]} ${y}</div><button class="${z==x?'selected':''}" onclick="pick('${k}','${x}')">${x} wins</button><button class="${z==y?'selected':''}" onclick="pick('${k}','${y}')">${y} wins</button><button class="${z=='NR'?'selected':''}" onclick="pick('${k}','NR')">Tie/NR</button></div>`}
function qual(){let a=stats(A,"G"),b=stats(B,"G");return {a:a.slice(0,3).map(x=>x.t),b:b.slice(0,3).map(x=>x.t),wild:a[3].pts>=b[3].pts?a[3].t:b[3].t}}
function st(s){let q=qual();return {...fixed,AB4:q.wild}}
function smatches(){let m=st();return S.map((x,i)=>[x[0],m[x[1]],m[x[2]],x[3],i])}
function sMatch(x){let[d,a,b,v,i]=x;if(!a||!b)return `<div class="match">${d}<br>Waiting for Group Stage qualification.</div>`;let k="S"+i,z=p[k];return `<div class="match"><div class="meta">${d} · ${v}</div><div class="teams">${F[a]} ${a} vs ${F[b]} ${b}</div><button class="${z==a?'selected':''}" onclick="pick('${k}','${a}')">${a} wins</button><button class="${z==b?'selected':''}" onclick="pick('${k}','${b}')">${b} wins</button><button class="${z=='NR'?'selected':''}" onclick="pick('${k}','NR')">Tie/NR</button></div>`}
function sstats(){let ts=[...new Set(smatches().flatMap(x=>[x[1],x[2]]).filter(Boolean))];return ts.map(t=>{let pts=0,w=0,l=0,n=0;smatches().forEach(x=>{let[d,a,b,v,i]=x;if(a!=t&&b!=t)return;let z=p["S"+i];if(!z)return;if(z=="NR"){pts++;n++}else if(z==t){pts+=2;w++}else l++});return{t,pts,w,l,n}}).sort((a,b)=>b.pts-a.pts||b.w-a.w||a.t.localeCompare(b.t))}
function ko(label,a,b,k){if(!a||!b)return `<div class="match">${label}<br>Complete Super 7 predictions first.</div>`;let z=p[k];return `<div class="match"><div class="meta">${label}</div><div class="teams">${F[a]} ${a} vs ${F[b]} ${b}</div><button class="${z==a?'selected':''}" onclick="pick('${k}','${a}')">${a} wins</button><button class="${z==b?'selected':''}" onclick="pick('${k}','${b}')">${b} wins</button></div>`}
function render(){let h=`<div class="card"><span class="badge">YOUR SCENARIO</span><h2>Qualifier A: 🏝️ West Indies</h2><h2>Qualifier B: 🇺🇸 USA</h2><div class="note">Tap a result under every match. Your predictions are saved on this device.</div></div>`;
h+=`<div class="card"><h2>🏏 Group Stage — 30 Matches</h2><div class="note">Group A and Group B fixtures are listed in chronological order.</div>${G.map((m,i)=>match(m,"G"+i)).join("")}</div>`;
h+=table(A,"📊 Group A Points Table")+table(B,"📊 Group B Points Table");
h+=`<div class="card"><h2>⭐ Super 7 — 21 Matches</h2><div class="note">The simulator uses your Group Stage qualification results.</div>${smatches().map(sMatch).join("")}</div>`;
let ss=sstats();h+=`<div class="card"><h2>📊 Super 7 Points Table</h2><table><tr><th>#</th><th>Team</th><th>Pts</th><th>W</th><th>L</th><th>T/NR</th></tr>${ss.map((x,i)=>`<tr><td>${i+1}</td><td>${F[x.t]} ${x.t}</td><td>${x.pts}</td><td>${x.w}</td><td>${x.l}</td><td>${x.n}</td></tr>`).join("")}</table></div>`;
let r=ss.slice(0,4).map(x=>x.t);h+=`<div class="card"><h2>🏆 Knockout Stage</h2>${ko("Semi-final 1 — 1st vs 4th",r[0],r[3],"SF1")}${ko("Semi-final 2 — 2nd vs 3rd",r[1],r[2],"SF2")}${ko("Final",p.SF1,p.SF2,"FINAL")}</div>`;
h+=`<div class="champ"><b>🏆 YOUR PREDICTED CHAMPION</b><div>${p.FINAL?F[p.FINAL]+" "+p.FINAL:"Make your final prediction!"}</div><br><button class="reset" onclick="reset()">🔄 Reset all predictions</button></div>`;document.getElementById("app").innerHTML=h}
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
